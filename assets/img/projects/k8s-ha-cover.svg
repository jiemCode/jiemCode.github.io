<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Topologie du cluster Kubernetes haute disponibilité">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12213a"/>
      <stop offset="100%" stop-color="#0a1526"/>
    </linearGradient>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .box { fill: #16294a; stroke: #286dc7; stroke-width: 2; }
      .box-lb { fill: #1d3a63; stroke: #4d92e8; stroke-width: 2.5; }
      .lbl { fill: #eaf1fb; font-size: 19px; font-weight: 600; }
      .sub { fill: #9db6d6; font-size: 14px; }
      .az { fill: none; stroke: #35507d; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .azt { fill: #7d97bb; font-size: 14px; letter-spacing: .08em; }
      .link { stroke: #4d92e8; stroke-width: 2; fill: none; opacity: .75; }
      .title { fill: #ffffff; font-size: 30px; font-weight: 700; }
      .kicker { fill: #4d92e8; font-size: 15px; font-weight: 600; letter-spacing: .16em; }
    </style>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>

  <text class="t kicker" x="60" y="62">KUBERNETES · HAUTE DISPONIBILITÉ</text>
  <text class="t title" x="60" y="102">Cluster multi-master sur AWS</text>

  <!-- Load balancer -->
  <rect class="box-lb" x="330" y="150" width="240" height="66" rx="10"/>
  <text class="t lbl" x="450" y="181" text-anchor="middle">HAProxy</text>
  <text class="t sub" x="450" y="203" text-anchor="middle">VIP · API server :6443</text>

  <!-- AZ containers -->
  <rect class="az" x="60" y="262" width="370" height="272" rx="14"/>
  <text class="t azt" x="80" y="288">AZ A</text>
  <rect class="az" x="470" y="262" width="370" height="272" rx="14"/>
  <text class="t azt" x="490" y="288">AZ B</text>

  <!-- Control planes -->
  <rect class="box" x="90" y="306" width="310" height="76" rx="10"/>
  <text class="t lbl" x="245" y="338" text-anchor="middle">Control plane 1</text>
  <text class="t sub" x="245" y="361" text-anchor="middle">kube-apiserver · etcd</text>

  <rect class="box" x="500" y="306" width="310" height="76" rx="10"/>
  <text class="t lbl" x="655" y="338" text-anchor="middle">Control plane 2</text>
  <text class="t sub" x="655" y="361" text-anchor="middle">kube-apiserver · etcd</text>

  <!-- Workers -->
  <rect class="box" x="90" y="422" width="310" height="76" rx="10"/>
  <text class="t lbl" x="245" y="454" text-anchor="middle">Worker 1</text>
  <text class="t sub" x="245" y="477" text-anchor="middle">kubelet · Calico</text>

  <rect class="box" x="500" y="422" width="310" height="76" rx="10"/>
  <text class="t lbl" x="655" y="454" text-anchor="middle">Worker 2</text>
  <text class="t sub" x="655" y="477" text-anchor="middle">kubelet · Calico</text>

  <!-- Links -->
  <path class="link" d="M400 216 L400 240 L245 240 L245 306"/>
  <path class="link" d="M500 216 L500 240 L655 240 L655 306"/>
  <path class="link" d="M245 382 L245 422"/>
  <path class="link" d="M655 382 L655 422"/>
  <path class="link" d="M400 344 L500 344" stroke-dasharray="5 5"/>
  <text class="t sub" x="450" y="336" text-anchor="middle" fill="#7d97bb">etcd</text>

  <text class="t sub" x="60" y="568">kubeadm · VPC multi-AZ · security groups durcis</text>
</svg>
